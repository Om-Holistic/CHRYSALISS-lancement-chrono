function fmt(ms){let n=Math.floor(ms/1000);return Math.floor(n/3600)+' h '+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function stop(){if(s.active){s.sessions.push({...s.active,end:Date.now()});s.active=null;save()}}
const info={vault:'Alpha : solde et historique, aucun échange. P2 : catalogue numérique, droits et échanges. Décorations, journaux, trackers habitudes/achats, immersions, Oracle et contenus bonus. Aucun produit physique. Production des récompenses à chiffrer.',account:'Politique proposée à valider : 24 mois compte, pièces, acquis, personnalisation, Oracle, favoris ; 12 mois historiques, journaux, mesures, bilans, questionnaire et progression ; 6 mois messagerie. Notification, export, suppression et archives légales séparées.',food:'Catalogue, déclaration IA et scan étiquette existent. Quantités à renseigner. Question unique par repas détaillé : pesé/connu = 1, mixte = 0,5, estimé = 0. Photo seule = 0 automatique, sans question. Plats génériques : composition approximative automatiquement, sans pénaliser la pesée. P2 codes-barres et recettes personnelles ; P3 photo et estimation IA.',score:'Distinguer absence de saisie et absence d’alimentation. Repas renseigné, détaillé, précision, protéines par repas et jour. Précision distincte de la provenance nutritionnelle ; repas sauté non applicable. Barème en pièces à arbitrer.'};
function card(t){let v=rem(t),d=done(t),run=s.active?.id===t.id,r=t.initial?100*(v||0)/t.initial:0;return `<div class="task"><div class="row"><input type="checkbox" aria-label="Valider" data-check="${t.id}" ${d?'checked':''}><span class="name">${esc(t.name)}</span><b>${h(v)}</b></div>${bar(r,r,d,true)}<div class="row"><small>${d?'Terminé':({w:'En cours',p:'À publier / confirmer',r:'À inventorier'}[t.status]||'À faire')}</small><select data-p="${t.id}" class="p${p(t)}">${[1,2,3].map(n=>`<option value="${n}" ${p(t)===n?'selected':''}>P${n} · ${['Alpha','Ensuite','Futur'][n-1]}</option>`).join('')}</select></div><div class="row"><div><span class="time" data-time="${t.id}"></span><br><small>Initial : ${h(t.initial)}</small></div><div>${d?'':`<input type="number" min="0" step="any" aria-label="Heures restantes" data-rem="${t.id}" value="${v===null?'':Number(v.toFixed(4))}" placeholder="Heures"> `}<button data-start="${t.id}" class="${run?'run':''}">${run?'Ⅱ':'▶'}</button></div></div></div>`}
function section(id,name,a,content,cls,color=''){let z=stats(scope(a));return `<div class="${cls}" style="--c:${color}"><details data-id="${id}" ${s.opened.includes(id)?'open':''}><summary>${esc(name)} <b>${h(z.r)}${z.unknown?' + ?':''}</b></summary>${content}</details>${indicators(scope(a))}${priorities(a)}<small class="time" data-time="${id}"></small></div>`}
function quick(){let ls=groups.flatMap(g=>g.lots.map(l=>({g,l}))).filter(({l})=>scope(l.subs.flatMap(u=>u.tasks)).length);let l=ls.find(x=>x.l.id===quickLot)?.l;return '<div class="quick"><label>Accès rapide <select id="quickLot"><option value="">Choisir un domaine</option>'+groups.map(g=>'<optgroup label="'+esc(g.name)+'">'+ls.filter(x=>x.g===g).map(({l})=>'<option value="'+l.id+'" '+(l.id===quickLot?'selected':'')+'>'+esc(l.name)+'</option>').join('')+'</optgroup>').join('')+'</select></label><label>Sous-partie <select id="quickSub" '+(!l?'disabled':'')+'><option value="">Toute la thématique</option>'+(l?l.subs.filter(u=>scope(u.tasks).length).map(u=>'<option value="'+u.id+'" '+(u.id===quickSub?'selected':'')+'>'+esc(u.name)+'</option>').join(''):'')+'</select></label></div>'}
function jump(){let g=groups.find(g=>g.lots.some(l=>l.id===quickLot));if(!g)return;s.opened=[...new Set([...s.opened,g.id,quickLot,...(quickSub?[quickSub]:[])])];save();render();requestAnimationFrame(()=>{let el=[...root.querySelectorAll('details[data-id]')].find(d=>d.dataset.id===(quickSub||quickLot));el?.scrollIntoView({block:'start',behavior:'smooth'})})}
function render(){let a=tasks.filter(t=>p(t)===1),z=stats(a),active=tasks.find(t=>t.id===s.active?.id),cards=tasks.filter(t=>t.cards&&done(t)).reduce((v,t)=>v+t.cards,0);root.innerHTML=`<small>MON COCKPIT PERSONNEL · V30</small><h1>Chrysaliss Lancement Chrono</h1><p class="note">Objectif interne : 18 décembre · à réévaluer</p><header><div class="grid"><div class="metric"><small>Temps investi connu</small><b id="total"></b><small>16 h 30 historiques incluses</small></div><div class="metric"><small>Reste Alpha</small><b>${h(z.r)}${z.unknown?' + ?':''}</b><small>${Math.ceil(z.r/5)} journées de 5 h minimum</small></div><div class="metric"><small>Pointages du jour</small><b id="today"></b></div><div class="metric"><small>Objectif quotidien</small><b>5 h</b></div></div><p><b>Avancement Alpha</b></p>${indicators(a)}${priorities(tasks)}<p>Total recensé : ${h(stats(tasks).r)}${stats(tasks).unknown?' + tâches à chiffrer':''}</p><div class="row"><span>${esc(active?.name||'Chronomètre global')}<br><b id="global"></b></span><button data-stop>Ⅱ Pause</button></div></header><nav>${[['all','Tout'],['1','Alpha'],['2','Ensuite'],['3','Futur'],['journal','Journal']].map(([v,n])=>`<button data-mode="${v}" class="${mode===v?'sel':''}">${n}</button>`).join('')}</nav><p class="note">Progression : rouge &gt;75 %, orange &gt;50 %, vert clair &gt;25 %, vert foncé ≤25 % restant.</p>`;
if(mode==='journal'){root.innerHTML+=`<div class="lot"><h2>Journal de production</h2><p>20 novembre : 1 h 30, questionnaire et coaching.</p><p>22–24 novembre : environ 15 h, non ventilées.</p>${s.sessions.slice().reverse().map(x=>`<p>${(x.approx?'25/11/2026 · matin (horaire indicatif)':new Date(x.start).toLocaleString('fr-FR'))} · ${esc(tasks.find(t=>t.id===x.id)?.name||(x.manualId==='macros-2026-11-25'?'Réglage des macros — durée approximative':x.id))} · ${fmt(x.end-x.start)}</p>`).join('')}<button data-export>Exporter JSON</button> <label>Importer une sauvegarde <input type="file" id="import" accept=".json,application/json"></label></div>`}else{root.innerHTML+=quick();root.innerHTML+='<nav><button data-expand>Déplier les thématiques</button><button data-collapse>Tout replier</button></nav>';for(const g of groups){let html='';for(const l of g.lots){let a=l.subs.flatMap(u=>u.tasks);if(!scope(a).length)continue;let content=info[l.id]?`<div class="info">${info[l.id]}</div>`:'';for(const u of l.subs){if(!scope(u.tasks).length)continue;let extra=u.id==='qg:7'?`<div class="info"><b>Oracle : ${cards} cartes validées par lots / 365</b><p>Jalons : 90 Alpha · 120 cohorte 2 · 365 futur. 5 min/carte.</p>${bar(cards/365*100,100-cards/365*100)}<label>Stock réel constaté (indépendant des lots) <input id="oracle" type="number" min="0" max="365" value="${s.oracle||0}"></label></div>`:'';content+=section(u.id,u.name,u.tasks,extra+scope(u.tasks).map(card).join(''),'sub')}html+=section(l.id,l.name,a,content,'lot',l.color)}if(html)root.innerHTML+=section(g.id,g.name,g.lots.flatMap(l=>l.subs.flatMap(u=>u.tasks)),html,'zone','#263d36')}}
if(s.active)root.innerHTML+=`<div class="sticky row"><span>${esc(active?.name||s.active.id)}<br><b data-time="${s.active.id}"></b></span><button data-stop>Ⅱ Pause</button></div>`;root.innerHTML+=`<footer>V30 · ${storage?'Stockage local selon navigateur':'Stockage indisponible : exporter avant fermeture'}. Notion non synchronisé automatiquement. Estimations provisoires ; les tâches non chiffrées sont exclues des heures.</footer>`;root.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(!d.isConnected)return;let id=d.dataset.id;s.opened=s.opened.filter(x=>x!==id);if(d.open)s.opened.push(id);save()}));tick()}
function tick(){let d=new Date();d.setHours(0,0,0,0);let today=[...s.sessions,...(s.active?[{...s.active,end:Date.now()}]:[])].reduce((v,x)=>v+Math.max(0,x.end-Math.max(x.start,+d)),0);document.querySelector('#total').textContent=fmt(59400000+elapsed());document.querySelector('#today').textContent=fmt(today);document.querySelector('#global').textContent=fmt(elapsed());root.querySelectorAll('[data-time]').forEach(e=>e.textContent=fmt(elapsed(e.dataset.time)))}
root.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('stop'in d)stop();else if(d.mode)mode=d.mode;else if('expand'in d)s.opened=[...new Set([...s.opened,...groups.flatMap(g=>[g.id,...g.lots.map(l=>l.id)])])];else if('collapse'in d)s.opened=[];else if(d.start){let same=s.active?.id===d.start;stop();if(!same)s.active={id:d.start,start:Date.now()}}else if('export'in d){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:11,state:s},null,2)],{type:'application/json'}));a.download='chrysaliss-v11.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}save();render()});
root.addEventListener('change',async e=>{let x=e.target,d=x.dataset;if(x.id==='quickLot'){quickLot=x.value;quickSub='';if(quickLot)jump();else render();return}else if(x.id==='quickSub'){quickSub=x.value;jump();return}else if(d.check){s.checks[d.check]=x.checked;if(x.checked&&s.active?.id===d.check)stop()}else if(d.p)s.priorities[d.p]=+x.value;else if(d.rem){if(x.value==='')delete s.remaining[d.rem];else s.remaining[d.rem]=Math.max(0,+x.value)}else if(x.id==='oracle')s.oracle=Math.max(0,Math.min(365,+x.value));else if(x.id==='import'){try{let v=JSON.parse(await x.files[0].text()),o=v.state||v;if(!o.checks||!o.remaining||!Array.isArray(o.sessions))throw Error();if(!confirm('Remplacer les pointages et réglages actuels par cette sauvegarde ?'))return;s=v.version===11?{...s,...o}:migrate(o)}catch(e){alert('Sauvegarde non valide');return}}save();render()});render();setInterval(tick,1000);
</script></html>
