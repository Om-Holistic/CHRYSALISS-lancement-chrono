function section(id,name,a,content,cls,color=''){let all=scope(a),z=stats(all),left=z.n-z.c,v=z.n?100*z.c/z.n:0,txt=z.n===z.c?'Tout est fait':z.c?`${z.c} réalisée${z.c>1?'s':''} sur ${z.n}`:`${z.n} tâche${z.n>1?'s':''}`;return `<div class="${cls}" style="--c:${color}"><details data-id="${id}" ${s.opened.includes(id)?'open':''}><summary><span class="t">${esc(name)}<span class="sum">${z.c&&z.c<z.n?`<span class="track"><i style="width:${v}%"></i></span>`:''}${txt}</span></span><span class="h">${!left?'✓':z.r?h(z.r)+(z.unknown?' + ?':''):'à chiffrer'}</span></summary>${cls==='sub'?'':priorities(a)}${content}</details></div>`}
function quick(){let ls=groups.flatMap(g=>g.lots.map(l=>({g,l}))).filter(({l})=>scope(l.subs.flatMap(u=>u.tasks)).length);let l=ls.find(x=>x.l.id===quickLot)?.l;return '<div class="quick"><label>Accès rapide <select id="quickLot"><option value="">Choisir un domaine</option>'+groups.map(g=>'<optgroup label="'+esc(g.name)+'">'+ls.filter(x=>x.g===g).map(({l})=>'<option value="'+l.id+'" '+(l.id===quickLot?'selected':'')+'>'+esc(l.name)+'</option>').join('')+'</optgroup>').join('')+'</select></label><label>Sous-partie <select id="quickSub" '+(!l?'disabled':'')+'><option value="">Toute la thématique</option>'+(l?l.subs.filter(u=>scope(u.tasks).length).map(u=>'<option value="'+u.id+'" '+(u.id===quickSub?'selected':'')+'>'+esc(u.name)+'</option>').join(''):'')+'</select></label></div>'}
function jump(){let g=groups.find(g=>g.lots.some(l=>l.id===quickLot));if(!g)return;s.opened=[...new Set([...s.opened,g.id,quickLot,...(quickSub?[quickSub]:[])])];save();render();requestAnimationFrame(()=>{let el=[...root.querySelectorAll('details[data-id]')].find(d=>d.dataset.id===(quickSub||quickLot));el?.scrollIntoView({block:'start',behavior:'smooth'})})}
function render(){let a=tasks.filter(t=>p(t)===1),z=stats(a),active=tasks.find(t=>t.id===s.active?.id),cards=tasks.filter(t=>t.cards&&done(t)).reduce((v,t)=>v+t.cards,0),cap=dleft(GEL)*5,ratio=cap?z.r/cap:9,ver=ratio<.75?['ok','Dans les temps']:ratio<1?['warn','Serré']:['bad','En retard'],cl=tasks.filter(t=>done(t)&&t.initial&&spent(t)),ce=cl.reduce((v,t)=>v+t.initial,0),cr=cl.reduce((v,t)=>v+spent(t)/3600000,0),pv=z.n?100*z.c/z.n:0;root.innerHTML=`<section class="hero"><div class="hero-top"><img src="cocon.svg" alt=""><div><h1>Lancement Chrono</h1><p>Alpha Chrysalis · lundi 11 janvier 2027</p></div></div><div class="count"><div><small>Avant le lancement</small><b class="num">J−${dleft(LAUNCH)}</b><small>Gel le 4 janvier · J−${dleft(GEL)}</small></div><div><small>Reste à faire</small><b class="num">${h(z.r)}</b><small>${z.unknown?'+ '+z.unknown+' à chiffrer':'tout est chiffré'}</small></div></div><div class="hero-row"><span>Avancement avant lancement</span><span class="num">${z.c}/${z.n} · ${Math.round(pv)} %</span></div>${bar(pv,100-pv)}<div class="verdict"><span class="pill ${ver[0]}">${ver[1]}</span><p>${h(z.r)} à faire pour ${cap} h disponibles d’ici le gel (5 h par jour)${z.unknown?', hors tâches non chiffrées':''}.</p></div></section><section class="panel"><h2>Temps passé</h2><div class="stats"><div class="stat" style="grid-column:1/-1"><small>Temps passé estimé depuis le 20 novembre</small><b class="num">${h(20+tasks.reduce((v,t)=>v+(t.real||0),0))}</b><small>20 h déclarées jusqu’au 25 novembre au matin, puis mon estimation tâche par tâche</small></div><div class="stat" style="grid-column:1/-1"><small>Estimé et réel sur les tâches terminées</small>${cl.length?`<b class="num">${h(ce)} estimé · ${h(cr)} réel</b>`:'<p style="margin:4px 0 0;font-size:14px">Pas encore de temps réel noté.</p>'}<small>${cl.length?(cr>ce?'Les tâches prennent '+Math.round(100*(cr/ce-1))+' % de plus que prévu':'Les tâches prennent '+Math.round(100*(1-cr/ce))+' % de moins que prévu'):'Je le remplis au fil des tâches terminées, à partir du temps de travail constaté.'}</small></div></div></section><nav class="tabs">${[['1','Avant lancement'],['4','Pendant l’Alpha'],['2','Après'],['3','Futur'],['all','Tout'],['journal','Journal']].map(([v,n])=>`<button data-mode="${v}" class="${mode===v?'sel':''}">${n}</button>`).join('')}</nav>`;
if(mode==='journal'){root.innerHTML+=`<div class="panel journal"><h2>Journal de production</h2><p>20 novembre : 1 h 30, questionnaire et coaching.</p><p>22–24 novembre : environ 15 h, non ventilées.</p>${s.sessions.slice().reverse().map(x=>`<p>${(x.approx?'25/11/2026 · matin (horaire indicatif)':new Date(x.start).toLocaleString('fr-FR'))} · ${esc(tasks.find(t=>t.id===x.id)?.name||repo.sessions.find(y=>y.manualId===x.manualId)?.label||x.label||x.id)} · ${fmt(x.end-x.start)}</p>`).join('')}</div>`}else{root.innerHTML+=quick()+'<p class="legend"><span><span class="state"></span>À faire</span><span><span class="state w"></span>En cours</span><span><span class="state p"></span>À valider par vous</span><span><span class="state done">✓</span>Terminée</span></p>';root.innerHTML+='<div class="tools"><button data-expand>Tout déplier</button><button data-collapse>Tout replier</button></div>';for(const g of groups){let html='';for(const l of g.lots){let a=l.subs.flatMap(u=>u.tasks);if(!scope(a).length)continue;let content=info[l.id]?`<div class="info">${info[l.id]}</div>`:'';for(const u of l.subs){if(!scope(u.tasks).length)continue;let extra=u.id==='qg:7'?`<div class="info"><b>Oracle : ${cards} cartes validées par lots / 365</b><p>Jalons : 90 Alpha · 120 cohorte 2 · 365 futur. 5 min/carte.</p>${bar(cards/365*100,100-cards/365*100)}<label>Stock réel constaté (indépendant des lots) <input id="oracle" type="number" min="0" max="365" value="${s.oracle||0}"></label></div>`:'';content+=section(u.id,u.name,u.tasks,extra+scope(u.tasks).map(card).join(''),'sub')}html+=section(l.id,l.name,a,content,'lot',l.color)}if(html)root.innerHTML+=section(g.id,g.name,g.lots.flatMap(l=>l.subs.flatMap(u=>u.tasks)),html,'zone','')}}
root.innerHTML+=`<footer>V49 · Avancement tenu à jour par Claude. Les estimations sont provisoires ; les tâches non chiffrées ne comptent pas dans les heures.</footer>`;root.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(!d.isConnected)return;let id=d.dataset.id;s.opened=s.opened.filter(x=>x!==id);if(d.open)s.opened.push(id);save()}));tick()}
function tick(){let d=new Date();d.setHours(0,0,0,0);let today=[...s.sessions,...(s.active?[{...s.active,end:Date.now()}]:[])].reduce((v,x)=>v+Math.max(0,x.end-Math.max(x.start,+d)),0),q=x=>document.querySelector(x),set=(x,v)=>{let e=q(x);if(e)e.textContent=v};}
root.addEventListener('click',e=>{let tk=e.target.closest('.task .name');if(tk){tk.parentElement.classList.toggle('open');return}let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('stop'in d)stop();else if(d.mode)mode=d.mode;else if('expand'in d)s.opened=[...new Set([...s.opened,...groups.flatMap(g=>[g.id,...g.lots.map(l=>l.id)])])];else if('collapse'in d)s.opened=[];else if(d.start){let same=s.active?.id===d.start;stop();if(!same)s.active={id:d.start,start:Date.now()}}else if('export'in d){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:11,state:s},null,2)],{type:'application/json'}));a.download='chrysaliss-v11.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}save();render()});
root.addEventListener('change',async e=>{let x=e.target,d=x.dataset;if(x.id==='quickLot'){quickLot=x.value;quickSub='';if(quickLot)jump();else render();return}else if(x.id==='quickSub'){quickSub=x.value;jump();return}else if(d.check){s.checks[d.check]=x.checked;if(x.checked&&s.active?.id===d.check)stop()}else if(d.p)s.priorities[d.p]=+x.value;else if(d.rem){if(x.value==='')delete s.remaining[d.rem];else s.remaining[d.rem]=Math.max(0,+x.value)}else if(x.id==='oracle')s.oracle=Math.max(0,Math.min(365,+x.value));else if(x.id==='import'){try{let v=JSON.parse(await x.files[0].text()),o=v.state||v;if(!o.checks||!o.remaining||!Array.isArray(o.sessions))throw Error();if(!confirm('Remplacer les pointages et réglages actuels par cette sauvegarde ?'))return;s=v.version===11?{...s,...o}:migrate(o)}catch(e){alert('Sauvegarde non valide');return}}save();render()});if(s.active){s.active=null;save()}render();
</script></html>
