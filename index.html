function fmt(ms){let n=Math.floor(ms/1000);return Math.floor(n/3600)+' h '+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function stop(){if(s.active){s.sessions.push({...s.active,end:Date.now()});s.active=null;save()}}
const info={vault:'Alpha : solde et historique, aucun échange. P2 : catalogue numérique, droits et échanges. Décorations, journaux, trackers habitudes/achats, immersions, Oracle et contenus bonus. Aucun produit physique. Production des récompenses à chiffrer.',account:'Politique proposée à valider : 24 mois compte, pièces, acquis, personnalisation, Oracle, favoris ; 12 mois historiques, journaux, mesures, bilans, questionnaire et progression ; 6 mois messagerie. Notification, export, suppression et archives légales séparées.',food:'Catalogue, déclaration IA et scan étiquette existent. Quantités à renseigner. Question unique par repas détaillé : pesé/connu = 1, mixte = 0,5, estimé = 0. Photo seule = 0 automatique, sans question. Plats génériques : composition approximative automatiquement, sans pénaliser la pesée. P2 codes-barres et recettes personnelles ; P3 photo et estimation IA.',score:'Distinguer absence de saisie et absence d’alimentation. Repas renseigné, détaillé, précision, protéines par repas et jour. Précision distincte de la provenance nutritionnelle ; repas sauté non applicable. Barème en pièces à arbitrer.'};
function card(t){let v=rem(t),d=done(t),run=s.active?.id===t.id,sp=spent(t),blk=/^BLOQUANT/.test(t.name),name=t.name.replace(/^BLOQUANT — /,''),st=d?'':t.status==='w'?'w':'',gap='';if(d&&t.initial&&sp){let g=sp/3600000-t.initial;gap=Math.abs(g)<1/60?'':`<span class="${g>0?'gap-plus':'gap-minus'}">${g>0?'+':'−'}${h(Math.abs(g))} vs estimé</span>`}return `<div class="task ${d?'done':''}" data-task><span class="state ${d?'done':t.status==='p'?'p':st}" aria-label="${d?'Terminée':st?'En cours':'À faire'}">${d?'✓':''}</span><div class="name">${blk?'<span class="pill blk">Bloquant</span> ':''}${!d&&t.status==='p'?'<span class="pill warn">À valider</span> ':''}${esc(name)}</div><div class="right"><span class="rem">${d||v===null?'':h(v)}</span></div><div class="det">${d&&t.initial===null?'':`<span>${t.initial===null?'Non chiffrée':'Estimé <b>'+h(t.initial)+'</b>'}</span>`}${sp?`<span>Passé ≈ <b>${hm(sp)}</b></span>`:''}${gap}${t.closed?`<span>✓ ${short(t.closed)}</span>`:t.added?`<span>Ajoutée ${short(t.added)}</span>`:''}${!d&&!t.closed&&p(t)!==1?`<span class="pill p${p(t)}">${PN[p(t)]}</span>`:''}</div></div>`}
function section(id,name,a,content,cls,color=''){let all=scope(a),z=stats(all),left=z.n-z.c,v=z.n?100*z.c/z.n:0,txt=z.n===z.c?'Tout est fait':z.c?`${z.c} réalisée${z.c>1?'s':''} sur ${z.n}`:`${z.n} tâche${z.n>1?'s':''}`;return `<div class="${cls}" style="--c:${color}"><details data-id="${id}" ${s.opened.includes(id)?'open':''}><summary><span class="t">${esc(name)}<span class="sum">${z.c&&z.c<z.n?`<span class="track"><i style="width:${v}%"></i></span>`:''}${txt}</span></span><span class="h">${!left?'✓':z.r?h(z.r)+(z.unknown?' + ?':''):'à chiffrer'}</span></summary>${cls==='sub'?'':priorities(a)}${content}</details></div>`}
function quick(){let ls=groups.flatMap(g=>g.lots.map(l=>({g,l}))).filter(({l})=>scope(l.subs.flatMap(u=>u.tasks)).length);let l=ls.find(x=>x.l.id===quickLot)?.l;return '<div class="quick"><label>Accès rapide <select id="quickLot"><option value="">Choisir un domaine</option>'+groups.map(g=>'<optgroup label="'+esc(g.name)+'">'+ls.filter(x=>x.g===g).map(({l})=>'<option value="'+l.id+'" '+(l.id===quickLot?'selected':'')+'>'+esc(l.name)+'</option>').join('')+'</optgroup>').join('')+'</select></label><label>Sous-partie <select id="quickSub" '+(!l?'disabled':'')+'><option value="">Toute la thématique</option>'+(l?l.subs.filter(u=>scope(u.tasks).length).map(u=>'<option value="'+u.id+'" '+(u.id===quickSub?'selected':'')+'>'+esc(u.name)+'</option>').join(''):'')+'</select></label></div>'}
function jump(){let g=groups.find(g=>g.lots.some(l=>l.id===quickLot));if(!g)return;s.opened=[...new Set([...s.opened,g.id,quickLot,...(quickSub?[quickSub]:[])])];save();render();requestAnimationFrame(()=>{let el=[...root.querySelectorAll('details[data-id]')].find(d=>d.dataset.id===(quickSub||quickLot));el?.scrollIntoView({block:'start',behavior:'smooth'})})}
function render(){let a=tasks.filter(t=>p(t)===1),z=stats(a),active=tasks.find(t=>t.id===s.active?.id),cards=tasks.filter(t=>t.cards&&done(t)).reduce((v,t)=>v+t.cards,0),cap=Math.round(dleft(GEL)*pace().perDay),ratio=cap?z.r/cap:9,ver=ratio<.75?['ok','Dans les temps']:ratio<1?['warn','Serré']:['bad','En retard'],cl=tasks.filter(t=>done(t)&&t.initial&&spent(t)),ce=cl.reduce((v,t)=>v+t.initial,0),cr=cl.reduce((v,t)=>v+spent(t)/3600000,0),pv=z.n?100*z.c/z.n:0,pc=pace();root.innerHTML=`<section class="hero"><div class="hero-top"><img src="cocon.svg" alt=""><h1>Lancement Chrono</h1><span class="pill ${ver[0]}" title="${h(z.r)} à faire, ${cap} h disponibles d’ici le 4 janvier à votre rythme">${ver[1]}</span></div><div class="date">Lancement prévu <b>lundi 11 janvier 2027</b> · dans ${dleft(LAUNCH)} jours</div><div class="est">Estimation du jour : prête vers le <b>${dayName(Date.now()+Math.ceil(z.r/pc.perDay)*86400000)}</b>, à votre rythme (≈ ${h(Math.round(pc.hpd*2)/2)} par jour, ${Math.round(pc.dpw)} jours sur 7)</div><div class="line num"><span>reste <b>${h(z.r)}</b></span><span><b>${Math.round(pv)} %</b> fait</span></div>${bar(pv,100-pv)}</section>${reports.length?`<button class="today" data-mode="report"><span><b>${esc(reports[0].title)}</b> · ${esc(reports[0].badge.split(' · ').slice(1).join(' · '))}</span><span aria-hidden="true">›</span></button>`:''}<p class="spent num">Temps passé ≈ <b>${h(20+tasks.reduce((v,t)=>v+(t.real||0),0))}</b> depuis le 20/11${cl.length?` · ${cr>ce?'+':'−'}${Math.round(100*Math.abs(cr/ce-1))} % vs estimé`:''}</p><nav class="tabs">${[['1','Avant lancement'],['4','Pendant l’Alpha'],['2','Après'],['3','Futur'],['all','Tout'],['report','Compte-rendu'],['journal','Journal']].map(([v,n])=>`<button data-mode="${v}" class="${mode===v?'sel':''}">${n}</button>`).join('')}</nav>`;
if(mode==='report'){root.innerHTML+=`<nav class="tabs seg">${[['day','Jour par jour'],['week','Semaine par semaine']].map(([v,n])=>`<button data-rview="${v}" class="${rview===v?'sel':''}">${n}</button>`).join('')}</nav>`;if(rview==='week'){root.innerHTML+=weeks()}else{root.innerHTML+=reports.map((r,i)=>`<div class="panel report"><details ${i===0?'open':''}><summary><span class="t">${esc(r.title)}<span class="sum">${esc(r.badge)}</span></span></summary><p class="lead">${r.lead}</p><div class="stats">${r.stats.map(([b,t])=>`<div class="stat"><b class="num">${b}</b><small>${t}</small></div>`).join('')}</div>${r.parts.map(([t,items])=>`<h3>${t}</h3><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul>`).join('')}</details></div>`).join('');root.innerHTML+=`<div class="panel est-list"><h2>Évolution de la date estimée</h2><p class="muted" style="font-size:13px">Lancement prévu le lundi 11 janvier 2027. Chaque soir, je note quand tout serait prêt à votre rythme réel : heures travaillées par jour et jours travaillés par semaine, sur les 4 dernières semaines.</p>${estimates.slice().reverse().map(([d,e])=>`<p>${stamp(d)} · prête vers le <b>${dayName(Date.parse(e+'T12:00:00+01:00'))}</b></p>`).join('')}</div>`;root.innerHTML+=`<div class="panel est-list"><h2>Notoriété</h2><p class="muted" style="font-size:13px">Le point Instagram et notoriété, du lundi au samedi à 13 h et 18 h.</p>${notoriete.map(([d,a,b])=>`<p>${stamp(d)} · <b>13 h</b> ${esc(a)}${b?` · <b>18 h</b> ${esc(b)}`:''} · <a href="https://github.com/Om-Holistic/chrysaliss-lancement-chrono/blob/main/notoriete/points/${d}.md" target="_blank" rel="noopener">le point complet</a></p>`).join('')}</div>`;}}else if(mode==='journal'){root.innerHTML+=`<div class="panel journal"><h2>Journal de production</h2><p>20 novembre : 1 h 30, questionnaire et coaching.</p><p>22–24 novembre : environ 15 h, non ventilées.</p>${s.sessions.slice().reverse().map(x=>`<p>${(x.approx?'25/11/2026 · matin (horaire indicatif)':new Date(x.start).toLocaleString('fr-FR'))} · ${esc(tasks.find(t=>t.id===x.id)?.name||repo.sessions.find(y=>y.manualId===x.manualId)?.label||x.label||x.id)} · ${fmt(x.end-x.start)}</p>`).join('')}</div>`}else{root.innerHTML+=quick()+'<p class="legend"><span><span class="state"></span>À faire</span><span><span class="state w"></span>En cours</span><span><span class="state p"></span>À valider par vous</span><span><span class="state done">✓</span>Terminée</span></p>';root.innerHTML+='<div class="tools"><button data-expand>Tout déplier</button><button data-collapse>Tout replier</button></div>';for(const g of groups){let html='';for(const l of g.lots){let a=l.subs.flatMap(u=>u.tasks);if(!scope(a).length)continue;let content=info[l.id]?`<div class="info">${info[l.id]}</div>`:'';for(const u of l.subs){if(!scope(u.tasks).length)continue;let extra=u.id==='qg:7'?`<div class="info"><b>Oracle : ${cards} cartes validées par lots / 365</b><p>Jalons : 90 Alpha · 120 cohorte 2 · 365 futur. 5 min/carte.</p>${bar(cards/365*100,100-cards/365*100)}<label>Stock réel constaté (indépendant des lots) <input id="oracle" type="number" min="0" max="365" value="${s.oracle||0}"></label></div>`:'';content+=section(u.id,u.name,u.tasks,extra+scope(u.tasks).map(card).join(''),'sub')}html+=section(l.id,l.name,a,content,'lot',l.color)}if(html)root.innerHTML+=section(g.id,g.name,g.lots.flatMap(l=>l.subs.flatMap(u=>u.tasks)),html,'zone','')}}
root.innerHTML+=`<footer>V96 · Avancement tenu à jour par Claude. Les estimations sont provisoires ; les tâches non chiffrées ne comptent pas dans les heures.</footer>`;root.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(!d.isConnected)return;let id=d.dataset.id;s.opened=s.opened.filter(x=>x!==id);if(d.open)s.opened.push(id);save()}));tick()}
function tick(){let d=new Date();d.setHours(0,0,0,0);let today=[...s.sessions,...(s.active?[{...s.active,end:Date.now()}]:[])].reduce((v,x)=>v+Math.max(0,x.end-Math.max(x.start,+d)),0),q=x=>document.querySelector(x),set=(x,v)=>{let e=q(x);if(e)e.textContent=v};}
root.addEventListener('click',e=>{let tk=e.target.closest('.task .name');if(tk){tk.parentElement.classList.toggle('open');return}let b=e.target.closest('button');if(!b)return;let d=b.dataset;if('stop'in d)stop();else if(d.mode)mode=d.mode;else if(d.rview)rview=d.rview;else if('expand'in d)s.opened=[...new Set([...s.opened,...groups.flatMap(g=>[g.id,...g.lots.map(l=>l.id)])])];else if('collapse'in d)s.opened=[];else if(d.start){let same=s.active?.id===d.start;stop();if(!same)s.active={id:d.start,start:Date.now()}}else if('export'in d){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:11,state:s},null,2)],{type:'application/json'}));a.download='chrysaliss-v11.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}save();render()});
root.addEventListener('change',async e=>{let x=e.target,d=x.dataset;if(x.id==='quickLot'){quickLot=x.value;quickSub='';if(quickLot)jump();else render();return}else if(x.id==='quickSub'){quickSub=x.value;jump();return}else if(d.check){s.checks[d.check]=x.checked;if(x.checked&&s.active?.id===d.check)stop()}else if(d.p)s.priorities[d.p]=+x.value;else if(d.rem){if(x.value==='')delete s.remaining[d.rem];else s.remaining[d.rem]=Math.max(0,+x.value)}else if(x.id==='oracle')s.oracle=Math.max(0,Math.min(365,+x.value));else if(x.id==='import'){try{let v=JSON.parse(await x.files[0].text()),o=v.state||v;if(!o.checks||!o.remaining||!Array.isArray(o.sessions))throw Error();if(!confirm('Remplacer les pointages et réglages actuels par cette sauvegarde ?'))return;s=v.version===11?{...s,...o}:migrate(o)}catch(e){alert('Sauvegarde non valide');return}}save();render()});if(s.active){s.active=null;save()}render();
</script></html>
